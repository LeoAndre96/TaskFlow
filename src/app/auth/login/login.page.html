<ion-content [fullscreen]="true">
  <div class="login-wrapper">
    <!-- BANNER IZQUIERDO (Desktop) -->
    <div class="banner-panel">
      <div class="banner-content">
        <div class="banner-badge">DEVIOZ TASKFLOW</div>
        <p class="banner-placeholder-text">Banner de la empresa / negocio u otros</p>
        <span class="banner-hint">Espacio preparado para logo corporativo o imagen publicitaria</span>
      </div>
    </div>

    <!-- FORMULARIO DERECHO (Gradiente Cyan-Azul) -->
    <div class="login-panel">
      <div class="login-card-container">
        
        <!-- Tarjeta blanca de Login -->
        <div class="login-card-header">
          <div class="user-avatar-circle">
            <svg class="avatar-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <circle cx="12" cy="7" r="4.5" stroke-width="2" />
              <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke-width="2" stroke-linecap="round" />
            </svg>
          </div>
          <h2 class="login-title">LOGIN</h2>
        </div>

        <form class="login-form" (ngSubmit)="onLogin()">
          
          <!-- Alerta de Error -->
          <div *ngIf="errorMessage" class="login-alert-error">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
            </svg>
            <span>{{ errorMessage }}</span>
          </div>

          <!-- Input: Correo o usuario -->
          <div class="custom-input-box">
            <div class="input-icon-slot">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
            </div>
            <div class="input-divider"></div>
            <input 
              type="text" 
              name="identifier" 
              [(ngModel)]="identifier" 
              placeholder="Correo o usuario" 
              required 
              autocomplete="username"
            />
          </div>

          <!-- Input: Contraseña -->
          <div class="custom-input-box">
            <div class="input-icon-slot">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
            </div>
            <div class="input-divider"></div>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              name="password" 
              [(ngModel)]="password" 
              placeholder="Contraseña" 
              required 
              autocomplete="current-password"
            />
            <div class="input-divider"></div>
            <button type="button" class="btn-toggle-eye" (click)="togglePasswordVisibility()" aria-label="Mostrar contraseña">
              <!-- Ojo normal -->
              <svg *ngIf="!showPassword" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Ojo tachado -->
              <svg *ngIf="showPassword" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>

          <!-- Enlaces de Crear cuenta y Olvidaste tu contraseña -->
          <div class="auth-links-row">
            <a routerLink="/register" class="auth-link">Crear cuenta</a>
            <a routerLink="/recover" class="auth-link">¿Olvidaste tu contraseña?</a>
          </div>

          <!-- Botón Iniciar sesión -->
          <div class="button-wrapper">
            <button type="submit" class="btn-login-action" [disabled]="isLoading">
              <span *ngIf="!isLoading">Iniciar sesion</span>
              <span *ngIf="isLoading">Verificando...</span>
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>
</ion-content>
